study:
  agency: Helix Water District
  title: Consumption Analysis
  units: hcf

# ---------------------------------------------------------------------------
# Billing calendar
#
# period_months groups the source file's fiscal months into billing periods.
# Helix bills bi-monthly, so six periods of two months each. A monthly agency
# uses twelve single-month groups and days_per_period: 30.
# ---------------------------------------------------------------------------
billing:
  days_per_period: 60
  period_months:
    BP1: [JUL, AUG]
    BP2: [SEP, OCT]
    BP3: [NOV, DEC]
    BP4: [JAN, FEB]
    BP5: [MAR, APR]
    BP6: [MAY, JUN]

fiscal_years: [FY2024, FY2025, FY2026]

# Derived usage series offered alongside the actual fiscal years.
derived_years:
  - name: 2-Yr Avg
    source_years: [FY2024, FY2025]
    days: roundup      # ROUNDUP(AVERAGE(...), 0)
    usage: rounddown   # ROUNDDOWN(AVERAGE(...), 0)

selected_year: FY2026

# ---------------------------------------------------------------------------
# Rate code -> customer class. Codes absent from this map are excluded from
# the analysis (Helix drops TEMP: temporary service, not reliable demand).
# ---------------------------------------------------------------------------
rate_code_map:
  WRS: Residential
  WMF: Multifamily
  WCM: NonRes
  WGV: NonRes
  WMN: Medical
  IRR: Irrigation
  AGRI: Irrigation   # agricultural; budget-based like the rest of irrigation

excluded_rate_codes: [TEMP]

meter_sizes: ['5/8"', '3/4"', '1"', '1.5"', '2"', '3"', '4"', '6"', '8"', '10"', '12"']

# ---------------------------------------------------------------------------
# Rate structures. tier_widths are WIDTHS, not breakpoints: Residential Tier 1
# spans 0-12 hcf and Tier 2 spans the next 14 (12-26). The final tier carries a
# deliberately large width so all remaining usage is captured.
#
# Commodity rates are blended - Helix's include a $3.91/hcf pass-through from
# the San Diego County Water Authority.
# ---------------------------------------------------------------------------
customer_classes:

  Residential:
    allocation: volumetric
    existing:
      tier_widths: [12, 14, 9999999, 99999999, 999999999]
      commodity_rates: [7.69, 8.06, 9.61, 0.0, 0.0]
      meter_charges:
        '5/8"': 79.15
        '3/4"': 118.13
        '1"': 254.47
        '1.5"': 390.83
        '2"': 868.10
        '3"': 1481.69
        '4"': 3137.50
        '6"': 5475.07
        '8"': 5475.07
        '10"': 0.0
        '12"': 0.0
    # ILLUSTRATIVE revised structure - placeholder for testing bill impacts.
    # Replace with the adopted proposed rates when the study reaches that stage.
    revised: &revised_meter_charges_res
      tier_widths: [12, 14, 9999999, 99999999, 999999999]
      commodity_rates: [8.30, 8.95, 10.85, 0.0, 0.0]
      meter_charges: &revised_meter_charges
        '5/8"': 85.50
        '3/4"': 127.60
        '1"': 274.85
        '1.5"': 422.10
        '2"': 937.55
        '3"': 1600.20
        '4"': 3388.50
        '6"': 5913.10
        '8"': 5913.10
        '10"': 0.0
        '12"': 0.0

  Multifamily:
    allocation: volumetric
    existing:
      tier_widths: [99999, 999999, 9999999, 99999999, 999999999]
      commodity_rates: [8.09, 0.0, 0.0, 0.0, 0.0]
      meter_charges: &existing_meter_charges
        '5/8"': 79.15
        '3/4"': 118.13
        '1"': 254.47
        '1.5"': 390.83
        '2"': 868.10
        '3"': 1481.69
        '4"': 3137.50
        '6"': 5475.07
        '8"': 5475.07
        '10"': 0.0
        '12"': 0.0
    revised:
      tier_widths: [99999, 999999, 9999999, 99999999, 999999999]
      commodity_rates: [8.74, 0.0, 0.0, 0.0, 0.0]
      meter_charges: *revised_meter_charges

  Medical:
    allocation: volumetric
    existing:
      tier_widths: [12, 14, 9999999, 99999999, 999999999]
      commodity_rates: [7.69, 8.06, 9.61, 0.0, 0.0]
      meter_charges: *existing_meter_charges
    revised:
      tier_widths: [12, 14, 9999999, 99999999, 999999999]
      commodity_rates: [8.30, 8.95, 10.85, 0.0, 0.0]
      meter_charges: *revised_meter_charges

  NonRes:
    allocation: volumetric
    existing:
      tier_widths: [99999, 999999, 9999999, 99999999, 999999999]
      commodity_rates: [8.14, 0.0, 0.0, 0.0, 0.0]
      meter_charges: *existing_meter_charges
    revised:
      tier_widths: [99999, 999999, 9999999, 99999999, 999999999]
      commodity_rates: [8.79, 0.0, 0.0, 0.0, 0.0]
      meter_charges: *revised_meter_charges

  # Budget-based: Tier 1 is each account's allotment for that billing period,
  # read from the water-budget table. The source budgets already account for
  # billing days, so they are NOT day-prorated the way volumetric tiers are.
  Irrigation:
    allocation: budget
    existing:
      tier_widths: [null, 999999, 9999999, 99999999, 999999999]
      commodity_rates: [8.24, 9.32, 0.0, 0.0, 0.0]
      meter_charges: *existing_meter_charges
    revised:
      tier_widths: [null, 999999, 9999999, 99999999, 999999999]
      commodity_rates: [8.90, 10.35, 0.0, 0.0, 0.0]
      meter_charges: *revised_meter_charges

# ---------------------------------------------------------------------------
# Accounts with usage but no water-budget record are given an allotment large
# enough to absorb that usage, placing it in Tier 1. This is the conservative
# reading for revenue. Periods with no usage are left alone - a zero budget
# there is just an account that had not yet come into service.
# ---------------------------------------------------------------------------
budget_gap_policy: cover_usage

# Buckets for the customer-impact tables.
impact_buckets:
  bill_dollars:
    Residential: [0, 5, 10, 25, 50]
    Multifamily: [0, 30, 60, 90, 110]
    Medical: [0, 5, 10, 25, 50]
    NonRes: [0, 30, 60, 90, 110]
    Irrigation: [0, 50, 75, 100, 125]
    # Used when the impact distribution is viewed across all classes at once.
    Total: [0, 10, 25, 50, 100]
  account_percent: [0.0, 0.05, 0.10, 0.25, 0.50]

# ---------------------------------------------------------------------------
# Affordability (supplemental — carries no Proposition 218 burden)
# ---------------------------------------------------------------------------
# Paths are relative to this config file. Populate geo/ with:
#   accounts_geo.csv  the agency's account -> ZIP or tract crosswalk
#   acs_zcta.csv      written by tools/fetch_census.py
#   zcta.geojson      Census cartographic-boundary file, clipped to the district
# Until crosswalk and acs exist the Affordability tab explains what is missing
# rather than failing.
affordability:
  # Default view. Falls back to whichever geography actually has its files.
  geography: tract
  crosswalk_key: location_no      # account column the crosswalks join on
  geographies:
    tract:                        # the analytic unit and the exhibit
      crosswalk: geo/accounts_tract.csv
      acs: geo/acs_tract.csv
      geometry: geo/tracts_clipped.geojson   # tools/fetch_tract_geometry.py -> clip_to_boundary.py
    zcta:                         # communication + cross-check only
      crosswalk: geo/accounts_address.csv
      acs: geo/acs_zcta.csv
      geometry: geo/zcta_clipped.geojson   # clipped to the service area; tools/clip_to_boundary.py
  # Which customers the burden is measured on. One entry per selectable
  # option; a single entry renders no selector. Helix is Single-Family only:
  # dwelling units are not tracked per master-metered complex (all 1 in the
  # extract), so a Multifamily bill cannot be split per household and a
  # per-complex burden against household income would be meaningless. For an
  # agency with real dwelling-unit counts, add:
  #   Multi-Family: [Multifamily]
  #   Residential (all): [Residential, Multifamily]
  class_options:
    Single-Family: [Residential]
  basis_classes: [Residential]    # fallback when class_options is absent
  per_unit_classes: [Multifamily] # master-metered: divide the bill by units
  bill_basis: actual              # actual | fixed_usage
  fixed_usage_per_month: 6.0      # hcf/month, the CA Needs Assessment convention
  min_accounts: 25                # suppress geographies thinner than this
  minimum_wage: 16.90             # CA statewide, effective 2026-01-01
  # Helix is a water-only district (all rate codes above are water: WRS/WMF/
  # WCM/WGV/WMN/IRR/AGRI) — the EPA drinking-water criterion is the sole
  # applicable convention. CA Needs Assessment and EPA's wastewater/combined
  # conventions are dropped from this build rather than shown and caveated.
  thresholds:
    epa_water: 0.025
  primary_threshold: epa_water
  boundary: geo/helix_boundary.geojson   # SWRCB SABL CA3710010, generalized 200 ft
  income_index:                   # ACS 2023 dollars -> Jul 2026 dollars
    enabled: true
    base: 362.022                 # San Diego-Carlsbad CPI-U, 2023 annual avg (FRED CUUSA424SA0)
    current: 400.877              # Jul 2026 (BLS San Diego area CPI release)
    note: San Diego-Carlsbad CPI-U; factor = current / base
